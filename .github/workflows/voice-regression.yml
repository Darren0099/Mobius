name: Mobius voice and desktop tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-unit-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mobius and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run unit and simulated voice-action tests
        run: python -m pytest -q tests
